<script>/* core.js */
// ===== core: constantes, utilitários, configurações e input =====
const W = 960, H = 540, STAGE_W = 1400, GROUND_SY = 468, GRAV = 0.75, MAXD = 560;
const cv = document.getElementById('c'), ctx = cv.getContext('2d');
const clamp = (v, a, b) => v < a ? a : v > b ? b : v;
const lerp = (a, b, t) => a + (b - a) * t;
const ease = t => t < .5 ? 2 * t * t : 1 - Math.pow(-2 * t + 2, 2) / 2;
const easeOut = t => 1 - Math.pow(1 - clamp(t, 0, 1), 3);
const easeBack = t => { t = clamp(t, 0, 1); const c = 1.7; return 1 + (c + 1) * Math.pow(t - 1, 3) + c * Math.pow(t - 1, 2); };
const rnd = (a, b) => a + Math.random() * (b - a);
const pick = a => a[Math.random() * a.length | 0];

const settings = { diff: 1, music: true, sfx: true, musicVol: 10, sfxVol: 10, voice: true, shouts: true, hitboxes: false, crt: false, name: '' };
try {
  const s = JSON.parse(localStorage.getItem('mf3_settings') || '{}') || {}; Object.assign(settings, s);
  // saves antigos só tinham liga/desliga
  if (s.musicVol == null && s.music === false) settings.musicVol = 0; if (s.sfxVol == null && s.sfx === false) settings.sfxVol = 0;
} catch (e) {}
settings.music = settings.musicVol > 0; settings.sfx = settings.sfxVol > 0;
function saveSettings() { try { localStorage.setItem('mf3_settings', JSON.stringify(settings)); } catch (e) {} }

// ---------- teclado ----------
const keys = {}, BTN = ['lp', 'hp', 'lk', 'hk'];
const KEYMAP = [
  { u: 'KeyW', d: 'KeyS', l: 'KeyA', r: 'KeyD', lp: 'KeyF', hp: 'KeyR', lk: 'KeyG', hk: 'KeyT', start: 'Enter' },
  { u: 'ArrowUp', d: 'ArrowDown', l: 'ArrowLeft', r: 'ArrowRight', lp: 'KeyK', hp: 'KeyI', lk: 'KeyL', hk: 'KeyO', start: 'Backspace' }
];
// campo de texto (código da sala online)
const TextInput = { active: false, value: '', max: 6, filter: /^[A-Z0-9]$/ };
addEventListener('keydown', e => {
  if (/Arrow|Space|Backspace|Tab/.test(e.code)) e.preventDefault();
  Audio.unlock();
  if (TextInput.active) {
    const k = e.key.length == 1 ? e.key.toUpperCase() : '';
    if (e.code == 'Backspace') TextInput.value = TextInput.value.slice(0, -1);
    else if (k && TextInput.filter.test(k) && TextInput.value.length < TextInput.max) TextInput.value += k;
    if (e.ctrlKey && e.code == 'KeyV' && navigator.clipboard) navigator.clipboard.readText().then(t => { TextInput.value = t.toUpperCase().replace(/[^A-Z0-9]/g, '').slice(0, TextInput.max); }).catch(() => {});
    if (e.code != 'Enter' && e.code != 'Escape') return;

  keys[e.code] = true;

addEventListener('keyup', e => keys[e.code] = false);
addEventListener('pointerdown', () => Audio.unlock());
addEventListener('blur', () => { for (const k in keys) keys[k] = false; });

// ---------- controles (Gamepad API) ----------
let padToast = null;
addEventListener('gamepadconnected', e => { padToast = { t: 240, msg: 'Controle conectado: ' + e.gamepad.id.slice(0, 40) }; });
addEventListener('gamepaddisconnected', () => { padToast = { t: 180, msg: 'Controle desconectado' }; });

  try { pads = Array.from(navigator.getGamepads ? navigator.getGamepads() : []); } catch (e) {}

function rawInput(i, merge) {
  const r = {}, maps = merge ? KEYMAP : [KEYMAP[i]];
  for (const m of maps) for (const k in m) r[k] = r[k] || !!keys[m[k]];
  const pads = padList(), mine = merge ? pads : pads[i] ? [pads[i]] : [];
  for (const p of mine) { const s = readPad(p); for (const k in s) r[k] = r[k] || s[k]; }

// codificação compacta (8 bits) para a rede
const IBITS = ['u', 'd', 'l', 'r', 'lp', 'hp', 'lk', 'hk'];
const encIn = r => IBITS.reduce((a, k, i) => a | (r[k] ? 1 << i : 0), 0);
const decIn = n => { const r = {}; IBITS.forEach((k, i) => { if (n & (1 << i)) r[k] = true; }); return r; };

    if (o.lp) { const fl = ac.createBiquadFilter(); fl.type = 'lowpass'; fl.Q.value = o.q || 1; fl.frequency.setValueAtTime(o.lp, t); if (o.lpTo) fl.frequency.exponentialRampToValueAtTime(o.lpTo, t + (o.lpT || d)); node.connect(fl); node = fl; }
    node.connect(g); g.connect(o.dest || this.sfxBus); if (o.send) g.connect(o.send);
    os.start(t); os.stop(t + d + (o.sus ? r * .3 : 0) + .05);
    return g;
  },
  noise(t, d, o = {}) {
    const ac = this.ac, s = ac.createBufferSource(), f = ac.createBiquadFilter(), g = ac.createGain();
    s.buffer = this.noiseBuf; s.playbackRate.value = o.rate || 1;
    f.type = o.type || 'bandpass'; f.frequency.setValueAtTime(o.f || 1000, t); f.Q.value = o.q || 1;
    if (o.fTo) f.frequency.exponentialRampToValueAtTime(o.fTo, t + d);
    const v = (o.vol ?? .3) * this.gainMul * this.vol(o.dest), a = o.a ?? .002;
    g.gain.setValueAtTime(0, t); g.gain.linearRampToValueAtTime(v, t + a); g.gain.exponentialRampToValueAtTime(.0005, t + d);
    s.connect(f).connect(g); g.connect(o.dest || this.sfxBus); if (o.send) g.connect(o.send);
    s.start(t, Math.random() * .5); s.stop(t + d + .05);
  },
  // ---- efeitos sonoros ----
  sfx(name, k = 1) {
    if (!this.ac || !settings.sfx || SIM.silent) return;
    const t = this.now + .005, R = this.rev, C = this.crush;
    this.gainMul = SFX_BOOST[name] || 1;
    switch (name) {
      case 'whiff': this.noise(t, .1 + .06 * k, { f: 1800 + 900 * k, fTo: 500, q: 2.5, vol: .14 * k }); break;
      case 'hitL': this.noise(t, .07, { f: 2400, q: .8, vol: .5, dest: C }); this.osc('sine', 190, t, .09, { slide: 70, vol: .5 }); break;
      case 'hitM': this.noise(t, .12, { f: 1400, q: .7, vol: .6, dest: C }); this.osc('sine', 150, t, .14, { slide: 50, vol: .7 }); this.osc('square', 90, t, .06, { vol: .12, lp: 900 }); break;
      case 'hitH':
        this.noise(t, .2, { f: 900, fTo: 300, q: .6, vol: .8, dest: C, send: R }); this.osc('sine', 120, t, .3, { slide: 38, vol: .9 });

      case 'block': this.osc('triangle', 1250, t, .08, { vol: .14 }); this.osc('square', 1870, t, .05, { vol: .05 }); this.noise(t, .06, { f: 3800, q: 3, vol: .3 }); break;

      case 'projBig': this.noise(t, .9, { f: 300, fTo: 2400, q: 2, vol: .5, send: R }); this.osc('sawtooth', 70, t, .9, { slide: 330, vol: .22, lp: 1500 }); this.osc('square', 140, t, .9, { slide: 660, vol: .06 }); break;
      case 'boom': this.osc('sawtooth', 900, t, .35, { slide: 300, vol: .12, lp: 3000, send: R }); this.noise(t, .3, { f: 2200, q: 5, vol: .25 }); break;
      case 'fire': this.noise(t, .5, { type: 'lowpass', f: 900, fTo: 300, vol: .45, send: R }); this.noise(t, .3, { f: 3000, q: 1, vol: .15, rate: .5 }); break;
      case 'elec': for (let i = 0; i < 5; i++) this.osc('square', 80 + Math.random() * 400, t + i * .025, .04, { vol: .08, lp: 3000 }); this.noise(t, .15, { f: 6000, q: 2, vol: .15 }); break;
      case 'psycho': this.osc('sawtooth', 60, t, .7, { slide: 180, vol: .2, lp: 900, send: R }); this.noise(t, .7, { f: 400, fTo: 1400, q: 4, vol: .3 }); break;
      case 'super':
        this.noise(t, 1.2, { f: 200, fTo: 6000, q: 2, vol: .35, send: R }); this.osc('sawtooth', 55, t, 1, { slide: 440, vol: .18, lp: 2000, send: R });
        [0, 4, 7, 12].forEach((n, i) => this.osc('square', 440 * Math.pow(2, n / 12), t + .35 + i * .04, .5, { vol: .04, send: R })); break;
      case 'land': this.noise(t, .08, { type: 'lowpass', f: 400, vol: .25 }); break;
      case 'fall': this.noise(t, .35, { type: 'lowpass', f: 300, vol: .7, send: R }); this.osc('sine', 80, t, .35, { slide: 32, vol: .8 }); break;
      case 'throw': this.noise(t, .25, { f: 500, q: 1, vol: .35 }); this.osc('sine', 110, t, .25, { slide: 55, vol: .5 }); break;
      case 'jump': this.noise(t, .09, { f: 1200, fTo: 2500, q: 2, vol: .08 }); break;
      case 'dash': this.noise(t, .18, { f: 700, fTo: 2200, q: 1.5, vol: .16 }); break;
      case 'teleport': this.osc('sine', 300, t, .35, { slide: 1800, vol: .12, send: R }); this.osc('sine', 1800, t + .15, .3, { slide: 300, vol: .1, send: R }); break;
      case 'counter': this.osc('square', 1320, t, .12, { vol: .07 }); this.osc('square', 1760, t + .07, .15, { vol: .07 }); break;
      case 'tech': this.osc('triangle', 2000, t, .2, { vol: .1, send: R }); break;
      case 'ko': this.osc('sine', 90, t, 1.6, { slide: 28, vol: 1, send: R }); this.noise(t, 1.2, { type: 'lowpass', f: 600, fTo: 80, vol: .8, send: R }); this.cheer(1.5); break;
      case 'bell': [0, 7, 12].forEach((n, i) => this.osc('triangle', 660 * Math.pow(2, n / 12), t + i * .005, 1.2, { vol: .09, send: R })); break;
      case 'select': this.osc('square', 660, t, .07, { vol: .06 }); this.osc('square', 990, t + .06, .12, { vol: .06, send: R }); break;
      case 'move': this.osc('square', 520, t, .035, { vol: .045, lp: 3000 }); break;
      case 'back': this.osc('square', 440, t, .06, { slide: 260, vol: .05 }); break;
      case 'slam': this.osc('sine', 60, t, .5, { slide: 30, vol: .9, send: R }); this.noise(t, .4, { type: 'lowpass', f: 500, vol: .6, send: R }); break;
      case 'timer': this.osc('square', 880, t, .05, { vol: .04 }); break;
    }
    this.gainMul = 1;
  },
  cheer(k = 1) {
    if (!this.ac || !settings.sfx || SIM.silent) return;
    const t = this.now;
    for (let i = 0; i < 3; i++) this.noise(t + i * .05, 1.4 * k, { f: 900 + i * 500, q: .7, vol: .05 * k, a: .25, send: this.rev });
  },
  // narrador (voz do sistema)
  say(txt) {
    if (!settings.voice || SIM.silent || !window.speechSynthesis) return;
    try { speechSynthesis.cancel(); const u = new SpeechSynthesisUtterance(txt); u.rate = .9; u.pitch = .35; u.volume = 1; u.lang = 'en-US'; speechSynthesis.speak(u); } catch (e) {}
  },
  // gritos dos lutadores nos especiais
  shout(ch, txt) {
    if (!settings.shouts || SIM.silent || !window.speechSynthesis || !txt) return;
    try { speechSynthesis.cancel(); const u = new SpeechSynthesisUtterance(txt); u.rate = 1.3; u.pitch = ch.voice || 1; u.volume = 1; u.lang = 'en-US'; speechSynthesis.speak(u); } catch (e) {}
  }
};

<script>/* music.js */
// ===== trilha sonora: instrumentos + sequenciador + músicas =====
const hz = n => 440 * Math.pow(2, (n - 69) / 12);
const Inst = {
  kick(t, v = 1) { const A = Audio; A.osc('sine', 160, t, .28, { slide: 42, slideT: .12, vol: .9 * v, dest: A.musicBus }); A.noise(t, .02, { type: 'highpass', f: 3000, vol: .12 * v, dest: A.musicBus }); },
  snare(t, v = 1, big) { const A = Audio; A.noise(t, big ? .3 : .17, { f: 1900, q: .7, vol: .5 * v, dest: A.musicBus, send: big ? A.rev : null }); A.osc('triangle', 200, t, .09, { slide: 120, vol: .3 * v, dest: A.musicBus }); },
  hat(t, v = 1, open) { Audio.noise(t, open ? .22 : .04, { type: 'highpass', f: 7500, vol: .13 * v, dest: Audio.musicBus }); },
  tom(t, v = 1, f = 110) { Audio.osc('sine', f, t, .35, { slide: f * .55, vol: .7 * v, dest: Audio.musicBus, send: Audio.rev }); Audio.noise(t, .05, { type: 'lowpass', f: 900, vol: .2 * v, dest: Audio.musicBus }); },
  crash(t) { Audio.noise(t, 1.2, { type: 'highpass', f: 5000, vol: .12, dest: Audio.musicBus, send: Audio.rev }); },
  bass(n, t, d, kind) {
    const A = Audio, f = hz(n);
    if (kind == 'sub') { A.osc('sine', f, t, d, { vol: .5, sus: 1, r: .05, dest: A.musicBus }); return; }
    A.osc(kind == 'square' ? 'square' : 'sawtooth', f, t, d, { vol: .28, lp: kind == 'rock' ? 2200 : 1500, lpTo: 260, lpT: d * .9, q: 5, sus: 1, r: .04, dest: A.musicBus });
    A.osc('sine', f, t, d, { vol: .3, sus: 1, r: .04, dest: A.musicBus });
  },
  lead(n, t, d, kind) {
    const A = Audio, f = hz(n), o = { vol: .085, sus: 1, r: .12, a: .012, dest: A.musicBus, send: A.delay, vib: 5.5, vibD: 5 };
    if (kind == 'koto') { A.osc('triangle', f * 1.01, t, .6, { slide: f, slideT: .04, vol: .22, lp: 3500, lpTo: 900, dest: A.musicBus, send: A.rev }); A.osc('sine', f * 2, t, .25, { vol: .06, dest: A.musicBus }); return; }
    if (kind == 'square') { A.osc('square', f, t, d, Object.assign({}, o, { vol: .06, lp: 2600 })); return; }
    if (kind == 'brass') { A.osc('sawtooth', f, t, d, Object.assign({}, o, { vol: .1, lp: 900, lpTo: 2600, lpT: .08 })); A.osc('sawtooth', f, t, d, Object.assign({}, o, { vol: .06, detune: 12, lp: 1800 })); return; }
    if (kind == 'guitar') { A.osc('sawtooth', f, t, d, Object.assign({}, o, { vol: .1, lp: 3000, vibD: 9 })); A.osc('square', f / 2, t, d, Object.assign({}, o, { vol: .05, lp: 1800 })); return; }
    A.osc('sawtooth', f, t, d, Object.assign({}, o, { detune: -9, lp: 3400 })); A.osc('sawtooth', f, t, d, Object.assign({}, o, { detune: 9, lp: 3400 }));
  },
  pluck(n, t) { Audio.osc('square', hz(n), t, .18, { vol: .045, lp: 3200, lpTo: 500, lpT: .15, dest: Audio.musicBus, send: Audio.delay }); },
  pad(ns, t, d) { for (const n of ns) for (const dt of [-7, 7]) Audio.osc('sawtooth', hz(n), t, d, { vol: .022, a: .35, sus: 1, r: .5, detune: dt, lp: 1100, dest: Audio.musicBus, send: Audio.rev }); },
  stab(ns, t) { for (const n of ns) Audio.osc('sawtooth', hz(n), t, .16, { vol: .05, lp: 2800, lpTo: 600, lpT: .12, dest: Audio.musicBus, send: Audio.rev }); }
};

const M16 = s => s.trim().split(/\s+/);
const SONGS = {
  title: { bpm: 140, root: 50, prog: [[0, 'm'], [-4, 'M'], [3, 'M'], [-2, 'M']], bassK: 'saw', lead: 'lead', pad: 1,
    drums: { k: 'x.....x.x.......', s: '....x.......x...', h: 'x.x.x.x.x.x.x.x.', o: '..............x.' }, bass: 'R.R.r.R.R.R.r.5.', arp: 'x.x.x.x.x.x.x.x.',
    mel: `12 . . 10 12 . 15 . 14 . 12 . 10 . 7 .  8 . . . 10 . 12 . 15 . . . 14 . 12 .  12 . 15 . 19 . . . 17 . 15 . 14 . 15 .  14 . . . 12 . 10 . 12 . . . - . . .
          19 . . . 17 . 15 . 17 . 19 . 22 . 19 .  17 . . . 15 . 14 . 15 . 17 . 15 . 14 .  12 . 15 . 17 . 19 . 24 . . . 22 . 19 .  22 . . . . . . . 19 . . . - . . .` },
  select: { bpm: 150, root: 52, prog: [[0, 'm'], [-4, 'M'], [-2, 'M'], [-5, 'M']], bassK: 'square', lead: 'square',
    drums: { k: 'x...x...x...x...', s: '....x.......x...', h: '.xxx.xxx.xxx.xxx' }, bass: 'R.rR.rR.R.rR.r5.', arp: 'x.xxx.xxx.xxx.xx',
    mel: `7 . 12 . 7 . 15 . 14 . 12 . 10 . 12 .  8 . 12 . 8 . 15 . 14 . 12 . 8 . 7 .  10 . 14 . 10 . 17 . 15 . 14 . 12 . 10 .  11 . . . 14 . . . 19 . . . 14 . 11 .` },
  temple: { bpm: 124, root: 57, prog: [[0, 'm'], [-4, 'M'], [5, 'm'], [7, 'M']], bassK: 'sub', lead: 'koto', pad: 1,
    drums: { k: 'x.......x..x....', t: '....x.....x.x...', h: 'x...x...x...x...', s: '............x...' }, bass: 'R.......R...5...',
    mel: `12 . . . 13 . 12 . 8 . . . 7 . . .  8 . . . 12 . 13 . 17 . . . 13 . 12 .  5 . 8 . 12 . 13 . 12 . 8 . 5 . . .  7 . . . . . 8 . 7 . . . - . . .
          19 . . . 20 . 19 . 17 . . . 13 . 12 .  13 . . . 17 . 19 . 20 . . . 19 . 17 .  17 . 13 . 12 . 13 . 17 . 13 . 12 . 8 .  7 . . . . . . . - . . . - . . .` },
  neon: { bpm: 112, root: 54, prog: [[0, 'm'], [-4, 'M'], [3, 'M'], [-2, 'M']], bassK: 'saw', lead: 'lead', pad: 1, bigSnare: 1,
    drums: { k: 'x...x...x...x...', s: '....x.......x...', h: '..x...x...x...x.' }, bass: 'R.r.R.r.R.r.R.r.', arp: 'xxxxxxxxxxxxxxxx',
    mel: `7 . . . . . 5 . 7 . . . 10 . . .  8 . . . . . 7 . 5 . . . 3 . . .  3 . . . 7 . . . 12 . . . 10 . 7 .  5 . . . . . . . 2 . . . - . . .
          12 . . . 14 . 15 . 14 . . . 12 . 10 .  10 . . . 12 . 10 . 8 . . . 7 . . .  7 . 10 . 12 . 15 . 19 . . . 17 . 15 .  14 . . . . . . . 10 . . . . . . .` },
  harbor: { bpm: 108, root: 55, prog: [[0, 'm'], [5, 'M'], [0, 'm'], [7, 'M']], bassK: 'saw', lead: 'brass',
    drums: { k: 'x..x..x...x..x..', s: '....x.......x..x', h: 'xxxxxxxxxxxxxxxx' }, bass: 'R..R.r..5..R.7.r', stab: '..x...x...x..x..',
    mel: `7 . 10 . - 12 . 10 . . 7 . 5 . 3 .  9 . . 12 . 9 . 7 . . 5 . 7 . 9 .  10 . 12 . 15 . 17 . 15 12 . 10 . . 7 .  14 . . . 11 . . . 7 . 9 . 11 . . .` },
  airbase: { bpm: 160, root: 52, prog: [[0, 'm'], [-4, 'M'], [-2, 'M'], [-5, 'M']], bassK: 'rock', lead: 'guitar', crash: 1,
    drums: { k: 'x.x...x.x.x...x.', s: '....x.......x...', h: 'x.x.x.x.x.x.x.x.' }, bass: 'RRRRRRRRRRRRRRRR',
    mel: `12 . . . 10 . 12 . 15 . . . 14 . 12 .  15 . . . 14 . 12 . 10 . . . 12 . . .  14 . . . 12 . 14 . 17 . . . 19 . 17 .  19 . . . . . . . 14 . . . - . . .` },
};
for (const k in SONGS) {
  const s = SONGS[k], tk = M16(s.mel), ev = {};
  for (let i = 0; i < tk.length; i++) {
    if (tk[i] == '.' || tk[i] == '-') continue;
    let len = 1; while (tk[i + len] == '.') len++;
    ev[i] = { n: +tk[i], len };
  }
  s.ev = ev; s.len = tk.length;
}

const Music = {
  cur: null, name: '', step: 0, t: 0,
  play(name) {
    if (this.name == name && this.cur) return;
    this.name = name; this.cur = SONGS[name] || null; this.step = 0; this.t = Audio.now + .1;
  },
  stop() { this.cur = null; this.name = ''; },
  tick() {
    const A = Audio; if (!A.ac || !this.cur || !settings.music) return;
    const s = this.cur, dt = 60 / s.bpm / 4;
    if (this.t < A.now - .25) this.t = A.now + .05;
    while (this.t < A.now + .15) { this.sched(s, this.step, this.t, dt); this.t += dt; this.step++; }
  },
  sched(s, step, t, dt) {
    const i = step % 16, bar = Math.floor(step / 16), [cr, q] = s.prog[bar % s.prog.length], root = s.root + cr;
    const tones = [0, q == 'm' ? 3 : 4, 7], D = s.drums, at = (p, j) => p && p[j % p.length] == 'x';
    const intro = bar < 2; // começo mais leve
    if (at(D.k, i)) Inst.kick(t);
    if (!intro && at(D.s, i)) Inst.snare(t, 1, s.bigSnare);
    if (at(D.h, i)) Inst.hat(t, i % 4 == 2 ? 1 : .6);
    if (!intro && at(D.o, i)) Inst.hat(t, .8, 1);
    if (at(D.t, i)) Inst.tom(t, 1, i % 8 == 4 ? 140 : 100);
    if (s.crash && i == 0 && bar % 4 == 0) Inst.crash(t);
    const b = s.bass[i];
    if (b && b != '.') {
      const off = { R: 0, r: 12, 5: 7, 3: tones[1], 7: 10 }[b] ?? 0; let len = 1; while (s.bass[i + len] == '.' && i + len < 16) len++;
      Inst.bass(root - 12 + off, t, dt * Math.min(len, 4) * .9, s.bassK);
    }
    if (s.arp && s.arp[i] == 'x' && bar >= 1) { const seq = [0, 1, 2, 3, 2, 1]; const k = seq[step % 6], n = root + 12 + (k == 3 ? 12 : tones[k]); Inst.pluck(n, t); }
    if (s.stab && s.stab[i] == 'x' && !intro) Inst.stab(tones.map(x => root + 12 + x), t);
    if (s.pad && i == 0) Inst.pad(tones.map(x => root + x), t, dt * 16);
    if (bar >= 2) { const e = s.ev[(step - 32) % s.len]; if (e) Inst.lead(s.root + 12 + e.n, t, dt * e.len * .95, s.lead); }
  },
  jingle(kind) {
    this.stop(); const A = Audio; if (!A.ac || !settings.music) return; const t = A.now + .05; A.gainMul = 2.5;
    const seq = kind == 'win' ? [[67, 0], [72, .12], [76, .24], [79, .36], [84, .6]] : [[64, 0], [63, .3], [62, .6], [61, .9]];
    seq.forEach(([n, dt], i) => { Inst.lead(n, t + dt, i == seq.length - 1 ? .9 : .14, kind == 'win' ? 'brass' : 'square'); });
    if (kind == 'win') { Inst.crash(t + .6); Inst.pad([60, 64, 67, 72], t + .6, 1.4); }
    A.gainMul = 1;
  }
};

  bounce(a) { a.mv = null; a.st = 'air'; a.stT = 0; a.airUsed = true; a.vx = -3.5 * a.face; a.vy = 8; a.y = Math.max(a.y, 1); },

// ===== câmera, utilitários de cenário e palcos 1-2 =====
const Cam = {
  x: STAGE_W / 2, z: 1.1, y: 0, zBoost: 0, tilt: 0,
  update(a, b, snap) {
    const mid = (a.x + b.x) / 2, sep = Math.abs(a.x - b.x);
    const tz = clamp(W / (sep + 470), .88, 1.28) + this.zBoost, ty = Math.max(0, Math.max(a.y, b.y) - 90) * .45;

    const half = W / 2 / this.z; this.x = clamp(lerp(this.x, mid, snap ? 1 : .2), half, STAGE_W - half);
    this.zBoost *= .93;
  },
  apply(c) { c.translate(W / 2, GROUND_SY); c.scale(this.z, this.z); c.translate(-this.x, this.y); },
  sx(wx, par = 1) { return W / 2 + (wx - this.x) * this.z * par; }

  crowd(r, n, spread, cols) { return Array.from({ length: n }, (_, i) => ({ x: i * spread + r() * 10, h: 34 + r() * 16, ph: r() * 6, c: cols[i % cols.length], hat: r() < .3, arms: r() < .5 })); },
  drawCrowd(c, list, par, baseY, cheer, span) {

  },

// ===== renderizador dos lutadores: anatomia vetorial com cel-shading =====
function ik(a, t, l1, l2, sign, stretch) {
  let d = Math.hypot(t.x - a.x, t.y - a.y);
  if (stretch && d > l1 + l2) { const k = d / (l1 + l2); l1 *= k; l2 *= k; }
  d = clamp(d, Math.abs(l1 - l2) + .01, l1 + l2 - .01);
  const base = Math.atan2(t.y - a.y, t.x - a.x), al = Math.acos(clamp((l1 * l1 + d * d - l2 * l2) / (2 * l1 * d), -1, 1)), an = base + sign * al;
  const j = { x: a.x + Math.cos(an) * l1, y: a.y + Math.sin(an) * l1 }, ea = Math.atan2(t.y - j.y, t.x - j.x);
  return [j, { x: j.x + Math.cos(ea) * l2, y: j.y + Math.sin(ea) * l2 }];
}
const _shadeCache = {};
const shade = (hex, k) => {

<script>/* head.js */
// ===== cabeça: crânio em perfil, rosto expressivo, cabelos =====
const HEAD_PTS = [[0, 10.6], [5.5, 9.8], [9.4, 6.8], [10.8, 3.2], [11.2, 1.3], [12.9, -1.9], [12.9, -1.9], [11.2, -3.4], [11.3, -5.2], [10.7, -7.3], [10.3, -9.8], [7.8, -12.1], [3.6, -11.6], [-.8, -7.6], [-6.5, -6.4], [-9.8, -2], [-10.4, 3], [-8.2, 7.8], [-4, 10.2]];

  buns: [[10.2, 5.5], [8, 10.8], [0, 13], [-8, 11.2], [-11, 5], [-10.6, -2.4], [-8, -3], [-6.5, 3], [0, 7.6], [6, 7.2]],
  mohawk: [[6, 10], [7.5, 16], [3, 12.6], [1.5, 18], [-2, 12.6], [-5, 16.5], [-6.5, 11], [-10.5, 12.5], [-9.6, 6.5], [-7, 7.2], [-3, 10.2], [2, 10.9]],

function headXf(hd, ang) { const co = Math.cos(ang), si = Math.sin(ang); return (x, y) => ({ x: hd.x + x * co - y * si, y: hd.y + x * si + y * co }); }

// peças atrás do corpo (rabo de cavalo, juba, cabelo longo, faixa)
function headBack(parts, ch, hd, ang, f) {

  const hurt = ['hit', 'knock', 'down', 'thrown', 'cineD', 'ko'].includes(f.st), atk = (f.st == 'atk' || f.st == 'air' || f.st == 'cine') && f.mv && f.t >= f.mv.s || f.st == 'cine' || f.st == 'win';
  const hp = ptsOf(tf, HEAD_PTS);

    col: skin, path: c => smoothClosed(c, hp),
    sh: inHead(hd, ang, c => {

<script>/* fx.js */
// ===== projéteis e efeitos visuais =====
function drawProj(c, pr) {
  const p = pr.p, d = Math.sign(pr.vx) || 1, T = pr.t;
  c.save(); c.translate(pr.x, -pr.y); c.scale(d, 1);
  switch (p.shape) {
    case 'kunai': {
      c.strokeStyle = 'rgba(220,220,255,.5)'; c.lineWidth = 1.5;
      for (let i = 0; i < 3; i++) { c.beginPath(); c.moveTo(-18 - i * 8, -4 + i * 4); c.lineTo(-40 - i * 10, -4 + i * 4); c.stroke(); }
      const g = c.createLinearGradient(0, -5, 0, 5); g.addColorStop(0, '#fff'); g.addColorStop(1, '#778');
      c.fillStyle = g; c.beginPath(); c.moveTo(16, 0); c.lineTo(-2, -5); c.lineTo(-2, 5); c.closePath(); c.fill();
      c.fillStyle = '#222'; c.fillRect(-13, -1.8, 11, 3.6); c.strokeStyle = '#999'; c.lineWidth = 1.5; c.beginPath(); c.arc(-16, 0, 3, 0, 7); c.stroke();
      break;
    }
    case 'boom': {
      c.globalCompositeOperation = 'lighter'; const r = p.r, w = Math.sin(T * .5) * .25;
      for (let k = 0; k < 3; k++) {
        c.strokeStyle = k ? `rgba(255,220,80,${.5 - k * .12})` : '#fff'; c.lineWidth = k ? 8 - k * 2 : 4;
        c.beginPath(); c.ellipse(-k * 12, 0, r * (.45 + w * .2), r * 1.4, 0, -Math.PI / 2, Math.PI / 2); c.stroke();
      }
      const g = c.createRadialGradient(0, 0, 0, 0, 0, r * 1.8); g.addColorStop(0, 'rgba(255,240,150,.5)'); g.addColorStop(1, 'rgba(255,200,50,0)');
      c.fillStyle = g; c.beginPath(); c.arc(0, 0, r * 1.8, 0, 7); c.fill();
      break;
    }
    case 'fire': case 'flame': {
      c.globalCompositeOperation = 'lighter'; const r = p.r * (p.shape == 'flame' ? 1 + Math.min(1, T / 6) * .3 : 1), n = p.shape == 'flame' ? 9 : 6;
      for (let i = 0; i < n; i++) {
        const u = i / n, x = -u * r * (p.shape == 'flame' ? 2.4 : 1.8), y = Math.sin(T * .7 + i * 1.7) * r * .25 * u, rr = r * (1 - u * .55) * (.85 + .15 * Math.sin(T + i));
        const g = c.createRadialGradient(x, y, 0, x, y, rr); g.addColorStop(0, i < 2 ? '#fff6c0' : p.glow); g.addColorStop(.5, p.col); g.addColorStop(1, 'rgba(255,60,0,0)');
        c.fillStyle = g; c.globalAlpha = p.shape == 'flame' ? Math.min(1, pr.life / 8) : 1; c.beginPath(); c.arc(x, y, rr, 0, 7); c.fill();
      }
      break;
    }
    default: {
      const r = p.r * (1 + .08 * Math.sin(T * .6));
      c.globalCompositeOperation = 'lighter';
      const g = c.createRadialGradient(0, 0, 0, 0, 0, r * 2.5); g.addColorStop(0, p.glow); g.addColorStop(.35, p.col); g.addColorStop(1, 'rgba(0,0,0,0)');
      c.fillStyle = g; c.globalAlpha = .55; c.beginPath(); c.arc(0, 0, r * 2.5, 0, 7); c.fill(); c.globalAlpha = 1;
      for (let k = 0; k < 3; k++) {
        const a = T * .3 + k * 2.1; c.fillStyle = p.col; c.globalAlpha = .6;
        c.beginPath(); c.moveTo(r * .2, 0); c.quadraticCurveTo(-r * .8, Math.sin(a) * r * 1.1, -r * (2 + k * .4), Math.sin(a * 1.3) * r * .6); c.quadraticCurveTo(-r * .8, Math.cos(a) * r * .5, r * .2, 0); c.fill();
      }
      c.globalAlpha = 1;
      const g2 = c.createRadialGradient(r * .2, 0, 0, 0, 0, r); g2.addColorStop(0, '#fff'); g2.addColorStop(.5, p.glow); g2.addColorStop(1, p.col);
      c.fillStyle = g2; c.beginPath(); c.ellipse(0, 0, r * 1.15, r, 0, 0, 7); c.fill();
      c.strokeStyle = 'rgba(255,255,255,.6)'; c.lineWidth = 2; c.beginPath(); c.arc(0, 0, r * .75, T * .3, T * .3 + 2); c.stroke();
      if (p.big) { c.strokeStyle = '#fff'; c.lineWidth = 2; for (let k = 0; k < 3; k++) { c.beginPath(); let x = 0, y = 0; c.moveTo(0, 0); for (let s = 0; s < 5; s++) { const a = Math.random() * 6.28; x += Math.cos(a) * r * .5; y += Math.sin(a) * r * .5; c.lineTo(x, y); } c.stroke(); } }
    }
  }
  c.restore();
}

const FX = {
  parts: [], texts: [],

    this.add({ type: 'streak', x, y, l: 8, s: 70 * sc, rot: dir > 0 ? rnd(-.3, .3) : Math.PI + rnd(-.3, .3), col: '#fff' });
    for (let i = 0; i < 12 * sc; i++) this.add({ type: 'spark', x, y, vx: dir * rnd(1, 9) + rnd(-3, 3), vy: rnd(-3, 7), g: -.35, l: rnd(12, 26), col: i % 3 ? col : '#fff' });

  },
  block(x, y, dir) {

    for (let i = 0; i < 8; i++) this.add({ type: 'spark', x, y, vx: -dir * rnd(1, 5), vy: rnd(-2, 5), g: -.3, l: rnd(8, 16), col: '#9df' });
  },
  dust(x, y, n) { for (let i = 0; i < n; i++) this.add({ type: 'dust', x: x + rnd(-24, 24), y: y + rnd(0, 6), vx: rnd(-2.2, 2.2), vy: rnd(.3, 1.8), l: rnd(20, 38), s: rnd(5, 12), grow: .3 }); },
  text(t, x, y, col) { if (!SIM.silent) this.texts.push({ t, x, y, col, l: 60 }); },
  banner(t, side) { if (!SIM.silent) M.banners.push({ t, side, l: 110 }); },
  slash(x, y, n) { this.add({ type: 'slash', x, y, l: 12, s: 150, rot: (n % 2 ? .7 : -.7) + rnd(-.3, .3), col: '#fff' }); },
  shock(x) { this.add({ type: 'shock', x, y: 0, l: 28, s: 20, grow: 16, col: '#ffd08a' }); this.dust(x - 60, 0, 12); this.dust(x + 60, 0, 12); },
  aura(f) { for (let i = 0; i < 40; i++) this.add({ type: 'glow', x: f.x + rnd(-45, 45), y: f.y + rnd(0, 140) * f.sz, vy: rnd(1, 3.5), l: rnd(24, 50), s: rnd(3, 8), col: f.ch.aura }); },
  update() {
    for (const p of this.parts) { p.x += p.vx; p.y += p.vy; p.vy += p.g; p.s += p.grow; p.l--; if (p.type == 'dust') { p.vx *= .92; p.vy *= .95; } if (p.type == 'fire') { p.vx *= .9; p.s *= .96; } }
    this.parts = this.parts.filter(p => p.l > 0);
    for (const t of this.texts) { t.y += .9; t.l--; } this.texts = this.texts.filter(t => t.l > 0);
    if (Game.scene != 'fight' && Game.scene != 'pause') return;
    for (const pr of M.projs) {
      if (pr.p.shape == 'kunai') continue;
      const fire = pr.p.shape == 'fire' || pr.p.shape == 'flame';
      this.add({ type: fire ? 'fire' : 'glow', x: pr.x - Math.sign(pr.vx) * pr.p.r * .7 + rnd(-5, 5), y: pr.y + rnd(-.5, .5) * pr.p.r, vx: -pr.vx * .15, vy: fire ? rnd(.5, 2) : rnd(-.6, .6), l: 16, s: pr.p.r * .45, col: pr.p.col });
    }
    for (const f of M.f || []) if (f.st == 'cine' || (f.mv && f.mv.super)) this.add({ type: 'glow', x: f.x + rnd(-30, 30), y: f.y + rnd(0, 120), vy: rnd(1, 3), l: 24, s: rnd(2, 6), col: f.ch.aura });
  },
  draw(c) {
    for (const p of this.parts) {
      const a = p.l / p.m, x = p.x, y = -p.y;
      c.globalAlpha = a;
      switch (p.type) {
        case 'flash': { c.globalCompositeOperation = 'lighter'; const g = c.createRadialGradient(x, y, 0, x, y, p.s); g.addColorStop(0, p.col); g.addColorStop(1, 'rgba(255,255,255,0)'); c.fillStyle = g; c.beginPath(); c.arc(x, y, p.s, 0, 7); c.fill(); c.globalCompositeOperation = 'source-over'; break; }
        case 'ring': c.strokeStyle = p.col; c.lineWidth = 5 * a; c.beginPath(); c.arc(x, y, p.s, 0, 7); c.stroke(); break;
        case 'star': c.fillStyle = p.col; c.beginPath(); for (let i = 0; i < 16; i++) { const an = p.rot + i * Math.PI / 8, r = i % 2 ? p.s * .22 : p.s * (.6 + (i % 4 == 0 ? .4 : 0)); c.lineTo(x + Math.cos(an) * r, y + Math.sin(an) * r); } c.fill(); break;
        case 'streak': c.save(); c.translate(x, y); c.rotate(p.rot); c.fillStyle = p.col; c.beginPath(); c.moveTo(0, -3 * a); c.lineTo(p.s * (1.4 - a * .4), 0); c.lineTo(0, 3 * a); c.fill(); c.restore(); break;
        case 'spark': c.strokeStyle = p.col; c.lineWidth = 2.5; c.beginPath(); c.moveTo(x, y); c.lineTo(x - p.vx * 2.2, y + p.vy * 2.2); c.stroke(); break;
        case 'dust': c.fillStyle = `rgba(215,185,150,${.5 * a})`; c.globalAlpha = 1; c.beginPath(); c.arc(x, y, p.s, 0, 7); c.fill(); break;
        case 'dia': c.strokeStyle = p.col; c.lineWidth = 4; c.beginPath(); c.moveTo(x, y - p.s); c.lineTo(x + p.s * .7, y); c.lineTo(x, y + p.s); c.lineTo(x - p.s * .7, y); c.closePath(); c.stroke(); break;
        case 'slash': c.save(); c.translate(x, y); c.rotate(p.rot); c.fillStyle = p.col; c.shadowColor = '#c8f'; c.shadowBlur = 16; c.beginPath(); c.ellipse(0, 0, p.s * (1.2 - a * .4), 4 * a, 0, 0, 7); c.fill(); c.restore(); break;
        case 'shock': c.strokeStyle = p.col; c.lineWidth = 6 * a; c.beginPath(); c.ellipse(x, y, p.s, p.s * .12, 0, 0, 7); c.stroke(); break;
        case 'glow': c.globalCompositeOperation = 'lighter'; c.fillStyle = p.col; c.beginPath(); c.arc(x, y, p.s * (.5 + a * .5), 0, 7); c.fill(); c.globalCompositeOperation = 'source-over'; break;
        case 'fire': { c.globalCompositeOperation = 'lighter'; c.fillStyle = a > .6 ? '#ffe9a0' : a > .3 ? '#ff8a2a' : '#c0300a'; c.beginPath(); c.arc(x, y, p.s * (.4 + a * .6), 0, 7); c.fill(); c.globalCompositeOperation = 'source-over'; break; }

    c.globalAlpha = 1;
  }

<script>/* ai.js */
// ===== IA da CPU =====
const DIFF = [
  { name: 'FÁCIL', react: 20, block: .25, aa: .15, combo: .2, agg: .45 },
  { name: 'NORMAL', react: 12, block: .55, aa: .5, combo: .55, agg: .7 },
  { name: 'DIFÍCIL', react: 6, block: .82, aa: .85, combo: .9, agg: .9 }
];
const AI = {
  projKey(ch) { return ch.ai.proj || null; },
  ender(f) {
    if (f.meter >= 100 && Math.random() < .45) return 'super';
    return pick(f.ch.ai.enders || ['shp']);
  },
  think(f, o) {
    const a = f.ai, D = DIFF[settings.diff], inp = {}, dist = Math.abs(o.x - f.x), fw = f.face > 0 ? 'r' : 'l', bk = f.face > 0 ? 'l' : 'r';
    const aaMove = f.ch.ai.aa || 'chp';
    // confirmação de acerto -> combo
    if (f.st == 'atk' && f.mv && f.hitAny && f.mv.cancel && a.conf !== f.mv) {
      a.conf = f.mv;
      if (Math.random() < D.combo) { inp.want = !f.mv.chain || Math.random() < .5 ? this.ender(f) : 'clp'; return inp; }
    }
    if (f.st == 'atk' && f.mv && f.mv.special && !f.mv.super && f.hitAny && f.meter >= 100 && a.conf !== 'su' && Math.random() < D.combo * .6) { a.conf = 'su'; inp.want = 'super'; return inp; }
    // reação a ameaças
    const proj = M.projs.find(p => p.o == o && Math.sign(p.vx) == -f.face && Math.abs(p.x - f.x) < 240);
    const threat = !!proj || (o.mv && (o.st == 'atk' || o.st == 'air') && o.mv.hits && o.t <= o.mv.s + 1 && dist < 220);
    if (threat && !a.threat) { a.threat = 1; a.tt = 0; a.roll = Math.random(); }
    if (!threat) a.threat = 0;
    if (a.threat && ++a.tt == D.react && (f.st == 'idle' || f.st == 'block')) {
      if (proj && dist > 170 && a.roll < .3 * D.agg) a.plan = { hold: { u: 1, [fw]: 1 }, t: 4 };
      else if (a.roll < D.block) { const low = o.mv && o.mv.hits && o.mv.hits.some(h => h.low); a.plan = { hold: { [bk]: 1, d: low ? 1 : 0 }, t: 26 }; }
    }
    // antiaéreo
    if (o.st == 'air' && o.vy < 3 && dist < 140 && !a.aa && f.st == 'idle') { a.aa = 1; if (Math.random() < D.aa) { inp.want = aaMove; return inp; } }
    if (o.st != 'air') a.aa = 0;
    if (a.plan && a.plan.t > 0) { a.plan.t--; Object.assign(inp, a.plan.hold); return inp; }
    if (f.st == 'air' && !f.mv && !f.airUsed) {
      if (f.ch.moves.dive && dist < 230 && dist > 60 && f.vy < 4 && Math.random() < .06) inp.want = 'dive';
      else if (dist < 120 && f.vy < 0 && f.y < 110) inp.want = Math.random() < .5 ? 'jhk' : 'jhp';
      return inp;
    }
    if (f.st != 'idle') return inp;
    if (a.cd > 0) { a.cd--; return inp; }
    a.cd = Math.round(D.react * rnd(.3, 1));
    // escolha por distância
    const R = Math.random(), pk = this.projKey(f.ch), myProj = M.projs.some(p => p.o == f), ai = f.ch.ai;
    if (f.meter >= 100 && dist < (getMove(f.ch, 'super').proj ? 520 : 150) && R < .3 * D.agg) inp.want = 'super';
    else if (dist > 300) {
      if (pk && !myProj && R < (ai.zoner ? .5 : .25)) inp.want = pk + ':' + (R < .2 ? 1 : 0);
      else if (R < .6 && (ai.step || ai.tele)) inp.want = ai.step || ai.tele;
      else if (R < .65) a.plan = { hold: { u: 1, [fw]: 1 }, t: 3 };
      else a.plan = { hold: { [fw]: 1 }, t: rnd(12, 30) | 0 };
    } else if (dist > 125) {
      if (pk && !myProj && R < (ai.zoner ? .3 : .12)) inp.want = pk + ':' + (R < .1 ? 1 : 0);
      else if (R < .2 * D.agg + .05) a.plan = { hold: { u: 1, [fw]: 1 }, t: 3 };
      else if (ai.rush && ai.enders && R < .36) inp.want = pick(ai.enders).replace(':1', ':0');
      else if (R < .5) a.plan = { hold: { [bk]: 1 }, t: rnd(8, 20) | 0 };
      else a.plan = { hold: { [fw]: 1 }, t: rnd(8, 20) | 0 };
    } else {
      if (ai.grab && R < .25) inp.want = ai.grab + ':' + (R < .1 ? 1 : 0);
      else if (R < .12) inp.want = 'throw';
      else if (R < .34) inp.want = 'clk';
      else if (R < .52) inp.want = 'slp';
      else if (R < .6) inp.want = 'shk';
      else if (R < .67) inp.want = 'chk';
      else if (R < .75) inp.want = 'shp';
      else if (R < .88) a.plan = { hold: { [bk]: 1, d: 1 }, t: 18 };
      else a.plan = { hold: { [bk]: 1 }, t: 12 };
    }
    return inp;
  }
};

<script>/* state.js */
// ===== snapshot / restauração do estado da luta (base do rollback netcode) =====
const State = {
  SKIP: { ch: 1, mv: 1, trail: 1, ai: 1, rp: 1 },
  M_KEYS: ['frame', 'stop', 'shake', 'dim', 'phase', 'phaseT', 'timer', 'round', 'slow', 'koMsg', 'flash', 'perfect', 'posed', 'matchOver'],
  idx(f) { return f === M.f[0] ? 0 : f === M.f[1] ? 1 : f == null ? -1 : -2; },
  ref(i, raw) { return i === 0 || i === 1 ? M.f[i] : i === -2 ? raw : null; },
  save() {
    const fs = M.f.map(f => {
      const o = {};
      for (const k in f) { if (this.SKIP[k]) continue; const v = f[k]; o[k] = v && typeof v == 'object' ? JSON.parse(JSON.stringify(v)) : v; }
      o._mv = f.mv ? f.mv.key : null; return o;
    });
    const m = {}; for (const k of this.M_KEYS) m[k] = M[k];
    m.winner = this.idx(M.winner); m.firstHit = M.firstHit === 1 ? -2 : this.idx(M.firstHit);
    m.comboShow = M.comboShow ? Object.assign({}, M.comboShow, { f: this.idx(M.comboShow.f) }) : null;
    m.superF = M.superF ? Object.assign({}, M.superF, { f: this.idx(M.superF.f) }) : null;
    m.banners = M.banners.map(b => Object.assign({}, b));
    const projs = M.projs.map(p => Object.assign({}, p, { o: this.idx(p.o), p: JSON.parse(JSON.stringify(p.p)) }));
    return { fs, m, projs };
  },
  load(s) {

<script>/* net.js */
// ===== multiplayer online: sala com vários jogadores ("quem ganha fica"), rollback e espectadores =====
// Topologia em estrela: todos se conectam ao anfitrião (PeerJS/WebRTC), que repassa as mensagens.
const NET_VERSION = 5, PEER_PREFIX = 'minifighter3-', MAX_ROOM = 8;

  peer: null, conn: null, conns: {}, pingOf: {}, seq: 0, viaRelay: false, role: null, id: null, code: '', status: '', error: '', ready: false, ping: 0, pings: [],

  join(code) {

      this.conn = c;

      c.on('error', () => { if (this.conn === c && this.ready) this.lost('Conexão perdida.'); });
    };

      this.relayTried = true; this.status = 'Conexão direta bloqueada pela rede — usando servidor de apoio...';

        () => { if (!this.ready && this.role == 'guest') { this.error = this.peerErr || 'Não foi possível entrar na sala. Confira o código e a internet.'; this.status = ''; this.role = null; } });

  // envio: alvo = 'host' | 'all' | 'opp' (outro lutador) | 'specs' (espectadores) | 'fs' (oponente + espectadores) | id

  sendTo(id, o) { const c = this.conns[id]; if (c) try { c.send(o); } catch (e) {} },

  broadcastRoom() { if (this.role != 'host') return; const room = JSON.parse(JSON.stringify(Room)); this.route({ t: 'room', room }, 'h', 'all'); Game.onRoom && Game.onRoom(); },

  onMsg(d, from) {

<script>/* relay.js */
// ===== plano B de conexão: servidor de mensagens público (MQTT via WebSocket) =====
// Usado quando a conexão direta (WebRTC) é bloqueada pela rede (4G, CGNAT, firewall).
// Cada "link" imita a API de conexão do PeerJS: on('open'|'data'|'close'|'error'), send(), close().
const Relay = {
  brokers: ['wss://broker.hivemq.com:8884/mqtt', 'wss://broker.emqx.io:8084/mqtt', 'wss://test.mosquitto.org:8081/mqtt'],
  clients: [], links: {}, watch: null,
  topic(code, who) { return 'minifighter3/v' + NET_VERSION + '/' + code + '/' + who; },
  available() { return typeof mqtt != 'undefined'; },
  newClient(url, extra = {}) { return mqtt.connect(url, Object.assign({ clientId: 'mf' + Math.random().toString(16).slice(2, 12), reconnectPeriod: 3000, connectTimeout: 8000, keepalive: 20 }, extra)); },
  startWatch() {
    clearInterval(this.watch);
    this.watch = setInterval(() => { const now = performance.now(); for (const k in this.links) { const l = this.links[k]; if (l.isOpen && now - l.seen > 10000) l.drop(); } }, 2000);
  },
  // ---- anfitrião: escuta em todos os servidores ----
  hostListen(code, onConn) {
    this.closeAll(); if (!this.available()) return;
    const hostTopic = this.topic(code, 'h');
    for (const url of this.brokers) {
      const c = this.newClient(url); this.clients.push(c);
      c.on('connect', () => c.subscribe(hostTopic, { qos: 1 }));
      c.on('message', (_, raw) => {
        let m; try { m = JSON.parse(raw); } catch (e) { return; }
        const key = url + '|' + m.cid; let link = this.links[key];
        if (!link) {
          if (!m.d || m.d.t != 'syn') return;
          link = this.links[key] = new RelayLink(c, this.topic(code, m.cid), null, key);
          onConn(link); link.send({ t: 'ack' }); setTimeout(() => link.opened(), 0);
          return;
        }
        link.recv(m.d);
      });
    }
    this.startWatch();
  },
  // ---- convidado: tenta os servidores em ordem até o anfitrião responder ----
  guestConnect(code, onLink, onFail, i = 0) {
    if (!this.available() || i >= this.brokers.length) { onFail(); return; }
    const cid = 'c' + Math.random().toString(36).slice(2, 10), hostTopic = this.topic(code, 'h');
    const c = this.newClient(this.brokers[i], { will: { topic: hostTopic, payload: JSON.stringify({ cid, d: { t: 'bye' } }), qos: 1 } });
    this.clients.push(c);

    });

      let d; try { d = JSON.parse(raw); } catch (e) { return; }

  },
  closeAll() {
    clearInterval(this.watch);
    for (const k in this.links) { try { this.links[k].close(); } catch (e) {} }
    for (const c of this.clients) { try { c.end(true); } catch (e) {} }
    this.clients = []; this.links = {};
  }
};
class RelayLink {
  constructor(client, outTopic, cid, key) { Object.assign(this, { client, outTopic, cid, key, h: {}, isOpen: false, closed: false, seen: performance.now(), relay: true }); }
  on(e, f) { (this.h[e] = this.h[e] || []).push(f); return this; }
  emit(e, ...a) { (this.h[e] || []).forEach(f => f(...a)); }
  opened() { this.isOpen = true; this.seen = performance.now(); this.emit('open'); }
  recv(d) { this.seen = performance.now(); if (d && d.t == 'bye') { this.drop(); return; } this.emit('data', d); }
  send(d) {
    if (this.closed) return;
    const qos = d.t == 'i' || d.t == 'ping' || d.t == 'pong' || d.t == 'h' ? 0 : 1;
    this.client.publish(this.outTopic, JSON.stringify(this.cid ? { cid: this.cid, d } : d), { qos });
  }
  drop() { if (this.closed) return; this.closed = true; this.isOpen = false; delete Relay.links[this.key]; this.emit('close'); }
  close() { if (this.closed) return; try { this.send({ t: 'bye' }); } catch (e) {} this.drop(); }
}

// ===== HUD e utilitários de interface =====
const FONT = '"Anton", Impact, "Arial Black", sans-serif', FONT2 = '"Rajdhani", "Segoe UI", Arial, sans-serif';

  if (stroke) { c.lineJoin = 'round'; c.lineWidth = stroke; c.strokeStyle = sc; c.strokeText(s, x, y); }

}
const ui = (c, s, x, y, size, col = '#fff', align = 'left', stroke = 0) => txt(c, s, x, y, size, col, align, stroke, '#000', FONT2);
function gradText(c, s, x, y, size, c1, c2, stroke = 8) {
  c.font = `${size}px ${FONT}`; c.textAlign = 'center'; c.lineJoin = 'round';
  c.lineWidth = stroke + 6; c.strokeStyle = '#000'; c.strokeText(s, x, y);
  c.lineWidth = stroke; c.strokeStyle = '#fff'; c.strokeText(s, x, y);
  const g = c.createLinearGradient(0, y - size, 0, y); g.addColorStop(0, c1); g.addColorStop(1, c2); c.fillStyle = g; c.fillText(s, x, y);
}
function slant(c, x, y, w, h, k = 12) { c.beginPath(); c.moveTo(x + k, y); c.lineTo(x + w + k, y); c.lineTo(x + w - k, y + h); c.lineTo(x - k, y + h); c.closePath(); }
function puppet(c, ch, x, y, k, face = 1, pose, extra = {}) {
  pose = pose || ch.stance || P.stand;

  if (seq == 'PPP') return 'Soco rápido 3x'; if (seq == 'KKK') return 'Chute rápido 3x';

}

<script>/* menus.js */
// ===== lógica das telas (título, modos, seleção, palco, online, pausa, resultados) =====
const shuffle = a => { for (let i = a.length - 1; i > 0; i--) { const j = Math.random() * (i + 1) | 0; [a[i], a[j]] = [a[j], a[i]]; } return a; };
const GRID_COLS = 5;

const Menus = {
  modes: [['ARCADE', 'Enfrente 6 lutadores da CPU até o chefe final'], ['VERSUS', '2 jogadores no mesmo computador (teclado dividido ou controles)'],
    ['ONLINE', 'Jogue pela internet com um amigo — crie uma sala e passe o código'], ['TREINO', 'Pratique combos contra um boneco configurável'], ['OPÇÕES', 'Dificuldade, som, música, narrador, controle']],
  lobbyJoin: false,
  nav(mi, n) { const g = Game; if (mi.u) { g.idx = (g.idx + n - 1) % n; Audio.sfx('move'); } if (mi.d) { g.idx = (g.idx + 1) % n; Audio.sfx('move'); } },
  optItems() {
    const on = (v, a = 'LIGADO', b = 'DESLIGADO') => v ? a : b;
    return [['DIFICULDADE DA CPU', DIFF[settings.diff].name, 'diff'], ['MÚSICA', settings.musicVol, 'musicVol'], ['EFEITOS SONOROS', settings.sfxVol, 'sfxVol'],
      ['NARRADOR', on(settings.voice), 'voice'], ['GRITOS DOS LUTADORES', on(settings.shouts), 'shouts'], ['FILTRO CRT (RETRÔ)', on(settings.crt), 'crt'],
      ['HITBOXES', settings.hitboxes ? 'VISÍVEIS' : 'OCULTAS', 'hitboxes'], ['TESTAR CONTROLE', '', 'pad'], ['VOLTAR', '', 'back']];
  },
  pauseItems() {
    const it = [['CONTINUAR', 'resume'], ['LISTA DE GOLPES', 'moves']];
    if (Game.mode == 'training') it.push(['BONECO: ' + Training.modes[Training.mode], 'dummy']);
    return it.concat([['REINICIAR', 'restart'], ['TROCAR PERSONAGEM', 'select'], ['MENU PRINCIPAL', 'menu']]);
  },
  update(s) {
    const g = Game, mi = s == 'select' || s == 'lobby' ? null : menuInput(0, true);
    switch (s) {
      case 'title':
        if (Stage.cur != 'temple') Stage.set('temple');
        if (mi.ok && g.t > 10) { Audio.sfx('select'); g.go('mode'); }
        if (g.t > 60 * 20) { g.t = 0; g.startAttract(); }
        break;
      case 'mode':
        this.nav(mi, this.modes.length);
        if (mi.ok) {
          Audio.sfx('select'); const m = ['arcade', 'versus', 'online', 'training', 'options'][g.idx];
          if (m == 'options') g.go('options'); else if (m == 'online') { g.netMsg = ''; g.go('online'); }
          else { g.mode = m; g.ready = [false, false]; g.go('select'); }
        }
        if (mi.back) { Audio.sfx('back'); g.go('title'); } break;
      case 'options': {
        const it = this.optItems(); this.nav(mi, it.length); const k = it[g.idx][2];
        if (mi.ok && k == 'pad') { Audio.sfx('select'); g.go('padtest'); break; }
        if ((mi.l || mi.r || mi.ok) && k != 'back' && k != 'pad') {
          if (k == 'diff') settings.diff = (settings.diff + (mi.l ? 2 : 1)) % 3;
          else if (k == 'musicVol' || k == 'sfxVol') {
            const v = settings[k]; settings[k] = mi.l ? Math.max(0, v - 1) : mi.r ? Math.min(10, v + 1) : (v + 1) % 11;
            settings.music = settings.musicVol > 0; settings.sfx = settings.sfxVol > 0;
          } else settings[k] = !settings[k];
          if (k == 'musicVol') { if (settings.music) Music.play('select'); else Music.stop(); }
          saveSettings(); Audio.sfx('move');
        }
        if ((mi.ok && k == 'back') || mi.back) { Audio.sfx('back'); g.go('mode'); }
        break;
      }
      case 'padtest': {
        const st = padList().some(p => readPad(p).start); g.startHeld = st ? (g.startHeld || 0) + 1 : 0;
        if (keys.Escape || keys.Backspace || g.startHeld > 90) { g.startHeld = 0; g.go('options'); }
        break;
      }
      case 'select': this.selectUpdate(); break;
      case 'stagesel':
        if (mi.l) { g.stageSel = (g.stageSel + 4) % 5; Audio.sfx('move'); } if (mi.r) { g.stageSel = (g.stageSel + 1) % 5; Audio.sfx('move'); }
        if (mi.ok) { Audio.sfx('select'); const id = g.stageSel == 4 ? pick(STAGE_IDS) : STAGE_IDS[g.stageSel]; g.lastStage = id; g.startMatch(g.sel[0], g.sel[1], id); }
        if (mi.back) { Audio.sfx('back'); g.ready = [false, false]; g.go('select'); } break;
      case 'vs': if (g.t > 190 || (g.t > 40 && mi.ok)) { g.t = -999; g.startMatch(g.sel[0], g.ladder[g.stage]); } break;
      case 'result':
        if (g.mode == 'online') { if (g.t > 30 && mi.back) this.leaveRoom(); break; }
        if (g.t > 40 && mi.ok) { if (g.mode == 'arcade') g.go('vs'); else g.startMatch(g.sel[0], g.sel[1], g.lastStage); }
        if (g.t > 40 && mi.back) { g.ready = [false, false]; g.go(g.mode == 'arcade' ? 'title' : 'select'); } break;
      case 'continue': if (mi.ok && g.t > 20) g.startMatch(g.sel[0], g.ladder[g.stage]); if (g.t > 600 || mi.back) g.go('gameover'); break;
      case 'gameover': if ((g.t > 60 && mi.ok) || g.t > 300) g.go('title'); break;
      case 'ending': if (g.t > 120 && mi.ok) g.go('title'); break;
      case 'pause': this.pauseUpdate(mi); break;
      case 'online': {
        if (this.editName) {
          if (keys.Enter) { keys.Enter = false; settings.name = TextInput.value.trim(); saveSettings(); TextInput.active = false; this.editName = false; Audio.sfx('select'); }
          else if (g.escEdge) { TextInput.active = false; this.editName = false; }
          break;
        }
        this.nav(mi, 4);
        if (mi.ok) {
          Audio.sfx('select');
          if (g.idx == 0) { g.netMsg = ''; this.lobbyJoin = false; Net.host(); g.go('lobby'); }
          else if (g.idx == 1) { g.netMsg = ''; this.lobbyJoin = true; Net.close(); TextInput.filter = /^[A-Z0-9]$/; TextInput.max = 5; TextInput.value = ''; TextInput.active = true; g.go('lobby'); }
          else if (g.idx == 2) { this.editName = true; TextInput.filter = /^[A-Z0-9 ]$/; TextInput.max = 12; TextInput.value = settings.name || ''; TextInput.active = true; }
          else g.go('mode');
        }
        if (mi.back) { Audio.sfx('back'); g.go('mode'); } break;
      }
      case 'lobby': this.lobbyUpdate(mi); break;
    }
  },
  leaveRoom() { const g = Game; TextInput.active = false; Net.close(); g.netMsg = ''; Audio.sfx('back'); g.go('online'); },
  lobbyUpdate(mi) {
    const g = Game;
    if (g.escEdge) return this.leaveRoom();
    if (this.lobbyJoin && TextInput.active) {
      if (keys.Enter && TextInput.value.length == 5) { keys.Enter = false; TextInput.active = false; Net.join(TextInput.value); }
      return;
    }
    if (this.lobbyJoin && Net.error && !Net.role) { TextInput.active = true; return; }
    if (Net.role == 'host' && Room.phase == 'lobby' && Room.members.length >= 2 && (keys.Enter || keys.Space || (mi && mi.ok))) { keys.Enter = false; Audio.sfx('select'); Net.hostStartSelect(); }
  },
  selectUpdate() {
    const g = Game, n = CHARS.length, online = g.mode == 'online', two = g.mode == 'versus';
    const move = (mi, slot) => {
      const s = g.sel[slot], rows = Math.ceil(n / GRID_COLS); let col = s % GRID_COLS, row = (s / GRID_COLS) | 0;
      if (mi.l) col = (col + GRID_COLS - 1) % GRID_COLS; if (mi.r) col = (col + 1) % GRID_COLS; if (mi.u || mi.d) row = (row + 1) % rows;
      const ns = Math.min(n - 1, row * GRID_COLS + col); if (ns != s) { g.sel[slot] = ns; Audio.sfx('move'); if (online) this.netSel(slot, ns, false); }
      if (mi.ok) { g.ready[slot] = true; Audio.sfx('select'); Audio.shout(CHARS[g.sel[slot]], CHARS[g.sel[slot]].name); if (online) this.netSel(slot, g.sel[slot], true); }
    };
    if (online) {
      g.sel = Room.sel.slice(); g.ready = Room.ready.slice();
      const mi = menuInput(0, true), me = Room.fighters.indexOf(Net.id);
      if (g.escEdge) return this.leaveRoom();
      if (me < 0) return;                          // espectador: só assiste
      if (!g.ready[me]) move(mi, me); else if (mi.back) this.netSel(me, g.sel[me], false);
      return;
    } else if (two) for (let i = 0; i < 2; i++) {
      const mi = menuInput(i, false);
      if (!g.ready[i]) { move(mi, i); if (i == 0 && mi.back) { Audio.sfx('back'); g.go('mode'); } } else if (mi.back) g.ready[i] = false;
    } else {
      const mi = menuInput(0, true), slot = !g.ready[0] ? 0 : g.mode == 'training' && !g.ready[1] ? 1 : -1;
      if (slot >= 0) { move(mi, slot); if (mi.back) { if (slot == 1) g.ready[0] = false; else { Audio.sfx('back'); g.go('mode'); } } }
      else if (mi.back) g.ready[g.mode == 'training' ? 1 : 0] = false;
    }
    const done = g.mode == 'arcade' ? g.ready[0] : g.ready[0] && g.ready[1];
    if (!done) { g.readyT = 0; return; }
    if (++g.readyT == 45) {
      if (g.mode == 'arcade') {
        const boss = CHARS.findIndex(c => c.id == 'kaiser');
        const others = shuffle(CHARS.map((_, i) => i).filter(i => i != g.sel[0] && i != boss)).slice(0, 5);
        g.ladder = g.sel[0] == boss ? others.concat(shuffle(CHARS.map((_, i) => i).filter(i => i != boss && !others.includes(i))).slice(0, 1)) : others.concat([boss]);
        g.stage = 0; g.go('vs');
      } else { g.stageSel = 4; g.go('stagesel'); }
    }
  },
  netSel(i, c, r) { Room.sel[i] = c; Room.ready[i] = r; Net.send('all', { t: 'sel', i, c, r }); if (Net.role == 'host') { Net.broadcastRoom(); Net.startIfReady(); } },
  pauseUpdate(mi) {
    const g = Game, it = this.pauseItems();
    if (g.showMoves) { if (mi.ok || mi.back || mi.start) g.showMoves = false; return; }
    this.nav(mi, it.length);
    const id = it[g.idx][1];
    if (id == 'dummy' && (mi.l || mi.r)) Training.mode = (Training.mode + (mi.l ? 4 : 1)) % 5;
    if (mi.start || mi.back) { g.scene = 'fight'; return; }
    if (!mi.ok) return;
    Audio.sfx('select');
    switch (id) {
      case 'resume': g.scene = 'fight'; break;
      case 'moves': g.showMoves = true; break;
      case 'dummy': Training.mode = (Training.mode + 1) % 5; break;
      case 'restart': for (const f of M.f) { f.wins = 0; f.meter = 0; } M.round = 1; g.newRound(); g.scene = 'fight'; break;
      case 'select': g.ready = [false, false]; g.go('select'); break;
      case 'menu': g.go('title'); break;
    }
  }
};

<script>/* game.js */
// ===== fluxo do jogo: cenas, luta (simulação determinística), treino, loop =====
const M = { frame: 0, f: [], projs: [], stop: 0, shake: 0, dim: 0, banners: [], comboShow: null, superF: null, firstHit: null,
  phase: '', phaseT: 0, timer: 0, round: 1, slow: 0, koMsg: '', winner: null, flash: 0, perfect: false, posed: 0, matchOver: false };
let UIF = 0; // contador de quadros da interface (animações de menu)

const Training = {
  modes: ['PARADO', 'AGACHADO', 'DEFESA', 'PULANDO', 'CPU'], mode: 0, last: { n: 0, dmg: 0 }, calm: 0,
  input(f, o) {
    const bk = f.face > 0 ? 'l' : 'r';
    switch (this.mode) {
      case 0: return {};
      case 1: return { d: 1 };
      case 2: { const low = o.mv && o.mv.hits && o.mv.hits.some(h => h.low); return { [bk]: 1, d: low ? 1 : 0 }; }
      case 3: return { u: 1 };
      default: return AI.think(f, o);
    }
  },
  update(a, b) {
    for (const [x, y] of [[a, b], [b, a]]) if ((y.st == 'hit' || y.st == 'knock') && x.comboDmg) this.last = { n: x.combo, dmg: x.comboDmg };
    const busy = f => ['hit', 'knock', 'down', 'wake', 'cineD', 'thrown', 'block', 'cine', 'throw'].includes(f.st);
    if (busy(a) || busy(b)) this.calm = 0;
    else if (++this.calm > 45) for (const f of [a, b]) { f.hp = f.ch.hp; f.hpS = f.hp; f.meter = 100; }
  }
};

const Game = {
  scene: 'title', mode: 'arcade', t: 0, idx: 0, sel: [0, 1], ready: [false, false], ladder: [], stage: 0, result: null, showMoves: false,
  stageSel: 0, trans: null, idle: 0, attract: false, quitAsk: false, netMsg: '', rematch: [false, false],
  go(s, cb) { if (this.trans) return; this.trans = { to: s, t: 0, dur: 13, cb }; },
  goNow(s) { this.scene = s; this.t = 0; this.idx = 0; },
  musicFor(s) { return { title: 'title', mode: 'select', options: 'select', padtest: 'select', select: 'select', stagesel: 'select', online: 'select', lobby: 'select', vs: 'select', continue: 'select', ending: 'title', gameover: 'title', howto: 'select' }[s]; },

  startMatch(c1, c2, stageId) {
    const ctl = this.mode == 'versus' ? 'human' : this.mode == 'training' ? 'dummy' : 'cpu';
    M.f = [new Fighter(0, CHARS[c1], this.attract ? 'cpu' : 'human'), new Fighter(1, CHARS[c2], ctl)];
    Stage.set(stageId || CHARS[c2].stage);
    M.round = 1; this.newRound(); this.go('fight', () => Music.play(Stage.def.music));
  },
  startOnline(c0, c1, stageId) {
    this.mode = 'online'; this.attract = false; this.quitAsk = false; this.forfeitMsg = '';
    M.f = [new Fighter(0, CHARS[c0], 'human'), new Fighter(1, CHARS[c1], 'human')];
    M.f.forEach((f, i) => f.netName = memberName(Room.fighters[i]));
    Stage.set(stageId); M.round = 1; M.frame = 0; this.newRound();
    const slot = Room.fighters.indexOf(Net.id); if (slot >= 0) Net.begin(slot); else Net.beginSpec();
    this.goNow('fight'); this.trans = null; Music.play(Stage.def.music);
  },
  onGoSelect() { this.mode = 'online'; this.quitAsk = false; TextInput.active = false; this.trans = null; this.go('select'); },
  onGoLobby(msg) { this.netMsg = msg || ''; Net.active = false; this.trans = null; Menus.lobbyJoin = false; this.go('lobby'); Music.play('select'); },
  onForfeit(w, who) {
    if (!M.f.length || this.mode != 'online') return;
    Net.active = false; this.forfeitMsg = who + ' saiu — vitória por W.O.';
    this.result = { w: M.f[w], l: M.f[1 - w] }; this.trans = null; this.go('result'); Music.jingle('win');
  },
  newRound() {
    const [a, b] = M.f; a.resetRound(STAGE_W / 2 - 150); b.resetRound(STAGE_W / 2 + 150); a.rp = b.rp = null;
    Object.assign(M, { projs: [], stop: 0, shake: 0, dim: 0, banners: [], comboShow: null, superF: null, firstHit: null, timer: 99 * 60, phaseT: 0, slow: 0, winner: null, koMsg: '', flash: 0, perfect: false, posed: 0, matchOver: false });
    if (!SIM.silent) { FX.parts = []; FX.texts = []; }
    M.phase = this.mode == 'training' ? 'fight' : 'intro';
    if (this.mode == 'training') { a.setSt('idle'); b.setSt('idle'); a.meter = b.meter = 100; M.firstHit = 1; }
    if (window.__testHP && this.mode == 'online') M.f.forEach(f => f.hp = window.__testHP); // só para testes automatizados
    Cam.update(a, b, true);
  },
  onKO(a, o) {
    if (M.phase != 'fight') return;
    if (this.mode == 'training') { o.hp = 1; return; }
    Object.assign(M, { phase: 'ko', phaseT: 0, slow: 110, flash: 14, winner: a, koMsg: 'K.O.', perfect: a.hp == a.ch.hp });
    a.wins++; Cam.zBoost = .3; Audio.sfx('ko'); Audio.say('K.O.'); Stage.cheer(3);
  },
  timeUp() {
    const [a, b] = M.f, ra = a.hp / a.ch.hp, rb = b.hp / b.ch.hp;
    Object.assign(M, { phase: 'ko', phaseT: 0, koMsg: 'TEMPO!', winner: ra > rb ? a : rb > ra ? b : null });
    if (M.winner) M.winner.wins++; Audio.say('Time');
  },
  // um quadro da luta. Determinístico: depende só do estado + inputs (usado pelo rollback)
  simStep(ia, ib) {
    const [a, b] = M.f; M.frame++;
    if (M.stop > 0) {
      M.stop--; for (const f of M.f) if (f.shakeT > 0) f.shakeT--;
      if (M.phase == 'fight') { if (ia && a.ctrl != 'cpu') a.readInput(ia); if (ib && b.ctrl != 'cpu') b.readInput(ib); }
      return;
    }
    if (M.dim > 0) M.dim--; if (M.flash > 0) M.flash--; if (M.shake > 0) M.shake = M.shake > .3 ? M.shake * .88 : 0;
    if (M.slow > 0) { M.slow--; if (M.slow % 3) return; }
    M.phaseT++;
    const live = M.phase == 'fight';
    a.update(b, live ? ia : null); b.update(a, live ? ib : null);
    Combat.checkHits(a, b); Combat.checkHits(b, a); Combat.updProjs();
    Combat.pushApart(a, b); Combat.limitDistance(a, b);
    for (const f of M.f) if (f.shakeT > 0) f.shakeT--;
    switch (M.phase) {
      case 'intro':
        if (M.phaseT == 20) { Audio.say(a.wins == 1 && b.wins == 1 ? 'Final round' : 'Round ' + ['one', 'two', 'three', 'four', 'five'][M.round - 1]); Audio.sfx('bell'); }
        if (M.phaseT == 88) Audio.say('Fight!');
        if (M.phaseT >= 112) { M.phase = 'fight'; for (const f of M.f) if (f.st == 'intro') f.setSt('idle'); }
        break;
      case 'fight':
        if (this.mode == 'training') Training.update(a, b);
        else { if (M.timer % 60 == 0 && M.timer <= 600 && M.timer > 0) Audio.sfx('timer'); if (--M.timer <= 0) this.timeUp(); }
        break;
      case 'ko': {
        const w = M.winner;
        if (M.phaseT >= 110 && w && w.st == 'idle' && !M.posed) { M.posed = 1; w.setSt('win'); Audio.say(w.ch.name + ' wins'); }
        if (M.phaseT >= 280) {
          M.posed = 0;
          if (a.wins >= 2 || b.wins >= 2 || M.round >= 5) { if (this.mode == 'online') M.matchOver = true; else this.matchEnd(); }
          else { M.round++; this.newRound(); }
        }
      }
    }
  },
  ctl(f, o) {
    if (M.phase != 'fight' && M.stop <= 0) return null;
    if (f.ctrl == 'human') return rawInput(f.i, this.mode != 'versus');
    if (f.ctrl == 'cpu') return AI.think(f, o);
    return Training.input(f, o);
  },
  fightUpdate() {
    const [a, b] = M.f;
    if (this.mode == 'online') {
      if (this.escEdge) this.quitAsk = !this.quitAsk;
      if (this.quitAsk && keys.Enter) { Net.close(); this.quitAsk = false; this.netMsg = 'Você saiu da sala.'; this.go('online'); Music.play('select'); return; }
      Net.tick(); Cam.update(a, b); return;
    }
    if (this.attract) { if (Object.values(keys).some(v => v) || padList().some(p => p.buttons.some(x => x.pressed))) { this.attract = false; this.go('title'); } }
    else {
      const mi = menuInput(0, this.mode != 'versus');
      if (mi.start || this.escEdge) { this.goNow('pause'); Audio.sfx('select'); return; }
      if (keys.KeyH && !this.hPrev) { settings.hitboxes = !settings.hitboxes; saveSettings(); } this.hPrev = keys.KeyH;
      if (this.mode == 'training' && keys.Digit1 && !this.dPrev) Training.mode = (Training.mode + 1) % Training.modes.length; this.dPrev = keys.Digit1;
    }
    this.simStep(this.ctl(a, b), this.ctl(b, a));
    Cam.update(a, b);
  },
  matchEnd() {
    const [a, b] = M.f, w = a.wins >= b.wins ? a : b;
    this.result = { w, l: w === a ? b : a };
    if (this.attract) { this.attract = false; this.go('title'); return; }
    Music.jingle('win');
    if (this.mode == 'online') { this.forfeitMsg = ''; if (Net.role == 'host') Net.hostMatchOver(w === a ? 0 : 1); this.go('result'); return; }
    if (this.mode == 'arcade') {
      if (w === a) { this.stage++; this.go(this.stage >= this.ladder.length ? 'ending' : 'result'); }
      else this.go('continue');
    } else { this.rematch = [false, false]; this.go('result'); }
  },
  onNetLost(msg) {
    this.netMsg = msg; this.quitAsk = false; this.trans = null;
    if (['fight', 'select', 'result', 'lobby', 'stagesel', 'pause'].includes(this.scene) && (this.mode == 'online' || this.scene == 'lobby')) { this.go('online'); Music.play('select'); }
  },
  startAttract() {
    this.attract = true; this.mode = 'arcade';
    const a = Math.random() * CHARS.length | 0; let b = Math.random() * CHARS.length | 0; if (b == a) b = (b + 1) % CHARS.length;
    this.startMatch(a, b, pick(STAGE_IDS));
  },
  update() {
    this.escEdge = keys.Escape && !this.escPrev; this.escPrev = keys.Escape; UIF++;
    if (this.trans) {
      const tr = this.trans; tr.t++;
      if (tr.t == tr.dur) { this.goNow(tr.to); if (tr.cb) tr.cb(); else { const mu = this.musicFor(tr.to); if (mu) Music.play(mu); } }
      if (tr.t >= tr.dur * 2) this.trans = null;
      if (this.scene == 'fight' && tr.t > tr.dur) this.fightUpdate();
      return;
    }
    if (this.scene == 'fight') this.fightUpdate(); else { this.t++; M.frame++; Menus.update(this.scene); }
  },

  // ---------- desenho da luta ----------
  drawFight(c) {
    const [a, b] = M.f;
    c.save(); if (M.shake > 0) c.translate(rnd(-1, 1) * M.shake, rnd(-1, 1) * M.shake * .6);
    Stage.draw(c);
    if (M.dim > 0) { c.fillStyle = `rgba(0,0,10,${Math.min(.72, M.dim / 40)})`; c.fillRect(-20, -20, W + 40, H + 40); }
    c.save(); Cam.apply(c);
    drawShadow(c, a); drawShadow(c, b);
    for (const f of [a, b]) for (const t of f.trail) { c.globalAlpha = t.a * .6; drawFighter(c, Object.assign(Object.create(f), { x: t.x, y: t.y, face: t.face, flash: 0, shakeT: 0 }), t.pose, f.ch.aura); }
    c.globalAlpha = 1;
    const order = (b.st == 'atk' || b.st == 'cine' || b.st == 'throw') ? [a, b] : [b, a];
    for (const f of order) { drawFighter(c, f, smoothPose(f)); drawSmear(c, f); }
    for (const p of M.projs) drawProj(c, p);
    FX.draw(c);
    if (settings.hitboxes) this.drawBoxes(c);
    c.restore();
    Stage.front(c);
    c.restore();
    if (!this.attract) { HUD.draw(c); HUD.superCut(c); } else HUD.attract(c);
    HUD.announce(c);
    if (M.flash > 0) { c.fillStyle = `rgba(255,255,255,${M.flash / 22})`; c.fillRect(0, 0, W, H); }
    if (this.mode == 'online') HUD.netInfo(c);
  },
  drawBoxes(c) {
    c.lineWidth = 2;
    for (const f of M.f) {
      c.strokeStyle = 'rgba(80,160,255,.9)'; c.fillStyle = 'rgba(80,160,255,.18)';
      for (const r of f.hurt()) { c.fillRect(r.x1, -r.y2, r.x2 - r.x1, r.y2 - r.y1); c.strokeRect(r.x1, -r.y2, r.x2 - r.x1, r.y2 - r.y1); }
      const m = f.mv; c.strokeStyle = 'rgba(255,60,60,.95)'; c.fillStyle = 'rgba(255,60,60,.25)';
      if (m && m.hits) for (const h of m.hits) if (f.t >= h.f[0] && f.t <= h.f[1]) { const r = f.box(h.box); c.fillRect(r.x1, -r.y2, r.x2 - r.x1, r.y2 - r.y1); c.strokeRect(r.x1, -r.y2, r.x2 - r.x1, r.y2 - r.y1); }
    }
    c.strokeStyle = 'rgba(255,60,60,.95)'; for (const p of M.projs) { c.beginPath(); c.arc(p.x, -p.y, p.p.r, 0, 7); c.stroke(); }
  }
};

// ---------- loop principal ----------
let acc = 0, lastT = performance.now();
function tick() { if (Audio.ac) Music.tick(); FX.update(); Game.update(); }
function render() {
  ctx.setTransform(1, 0, 0, 1, 0, 0); ctx.clearRect(0, 0, W, H);
  if (Game.scene == 'fight' || Game.scene == 'pause') { Game.drawFight(ctx); if (Game.scene == 'pause') Menus.draw('pause'); if (Game.quitAsk) Menus.drawQuit(ctx); }
  else Menus.draw(Game.scene);
  if (Game.trans) Menus.drawTrans(ctx, Game.trans);
  if (settings.crt) Menus.drawCRT(ctx);
  if (padToast && padToast.t > 0) { padToast.t--; ctx.globalAlpha = Math.min(1, padToast.t / 30); ctx.fillStyle = 'rgba(0,0,0,.75)'; ctx.fillRect(W / 2 - 250, H - 70, 500, 34); txt(ctx, padToast.msg, W / 2, H - 46, 17, '#6f6', 'center', 0); ctx.globalAlpha = 1; }
}
function loop(now) {
  acc += Math.min(100, now - lastT); lastT = now;
  while (acc >= 1000 / 60) { tick(); acc -= 1000 / 60; }
  render(); requestAnimationFrame(loop);
}

</script>
<script>Music.play('title'); requestAnimationFrame(loop);</script>
</body>
