<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Jogando · Fliperama</title>
<link rel="icon" href="design/marca.svg" type="image/svg+xml">
<script src="design/tema.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="design/tokens.css">
<link rel="stylesheet" href="design/components.css">
<style>
/* Player: só layout. Cores, fontes e raios vêm dos tokens (DESIGN.md). */
html, body { height: 100%; }
:root { --bar-h: calc(56px + env(safe-area-inset-top, 0px)); }
body { display: flex; flex-direction: column; overflow: hidden; font-size: var(--fs-2); }
.top {
  flex: none; display: flex; align-items: center; gap: var(--sp-3);
  height: calc(56px + env(safe-area-inset-top, 0px)); padding: env(safe-area-inset-top, 0px) var(--sp-3) 0;
  background: var(--surface); box-shadow: 0 1px 0 var(--line);
}
.back { font-size: var(--fs-4); flex: none; }
.who { min-width: 0; display: flex; flex-direction: column; gap: 2px; padding-left: var(--sp-3); border-left: 1px solid var(--line); }
.who b { font: 700 var(--fs-2)/1.15 var(--font-display); letter-spacing: -.01em; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.who span { font-size: var(--fs-1); color: var(--ink-2); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.ver { flex: none; display: flex; align-items: center; gap: var(--sp-2); color: var(--ink-2); font-size: var(--fs-1); font-weight: 600; }
.ver[hidden] { display: none; }
.ver select {
  min-height: 36px; max-width: 40vw; padding: 0 var(--sp-3);
  border-radius: var(--r-pill); border: 1px solid var(--line-strong);
  background: var(--surface-2); color: var(--ink); font: 600 var(--fs-2) var(--font-body); cursor: pointer;
}
.tools { margin-left: auto; display: flex; gap: var(--sp-2); }
.tools .btn { min-height: 36px; padding: 0 var(--sp-4); }
.tools .btn--icon { width: 36px; padding: 0; }
.tools .btn--icon svg { width: 18px; height: 18px; }
.tools[hidden], .tools .btn[hidden] { display: none; }
iframe { flex: 1; width: 100%; border: 0; display: block; background: #000; }
/* jogando: a barra fica escondida; só a seta aparece, e a barra desce por cima do jogo */
body.has-game .top {
  position: fixed; top: 0; left: 0; right: 0; z-index: var(--z-bar);
  box-shadow: var(--shadow-3);
  transform: translateY(-100%); visibility: hidden;
  transition: transform var(--dur-3) var(--ease-out), visibility 0s linear var(--dur-3);
}
body.has-game.bar-open .top { transform: none; visibility: visible; transition: transform var(--dur-3) var(--ease-out); }
.bar-handle { display: none; }
body.has-game .bar-handle {
  position: fixed; top: env(safe-area-inset-top, 0px); left: 50%; z-index: calc(var(--z-bar) + 1);
  display: grid; place-items: center; width: 56px; height: 28px;
  transform: translateX(-50%);
  border: 0; border-radius: 0 0 var(--r-sm) var(--r-sm);
  background: var(--surface); color: var(--ink); box-shadow: var(--shadow-2);
  opacity: .35;
  transition: opacity var(--dur-2) var(--ease-out), top var(--dur-3) var(--ease-out);
}
body.has-game .bar-handle:hover, body.has-game .bar-handle:focus-visible, body.bar-open .bar-handle { opacity: 1; }
body.bar-open .bar-handle { top: var(--bar-h); }
.bar-handle svg { width: 18px; height: 18px; transition: rotate var(--dur-3) var(--ease-spring); }
body.bar-open .bar-handle svg { rotate: 180deg; }
.msg { margin: auto; max-width: 44ch; padding: var(--sp-5) var(--gutter); text-align: center; color: var(--ink-2); }
.msg a { color: var(--accent); font-weight: 600; }
@media (max-width: 640px) { .back { font-size: var(--fs-3); } .who span, .tools .opt, .ver span { display: none; } }
</style>
</head>
<body>
<div class="top" id="bar">
  <a class="logo back" href="./" aria-label="Voltar pro Fliperama">
    <span class="logo__word" data-text="Fliperama">Fliperama</span>
  </a>
  <div class="who"><b id="title"></b><span id="by"></span></div>
  <label class="ver" id="verBox" hidden><span>Versão</span><select id="ver"></select></label>
  <div class="tools">
    <button type="button" id="reload" class="btn btn--ghost opt">Reiniciar</button>
    <a id="code" class="btn btn--ghost opt" target="_blank" rel="noopener" hidden>Código</a>
    <button type="button" class="btn btn--ghost btn--icon theme-toggle" data-theme-toggle aria-label="Usar tema escuro" aria-pressed="false">
      <svg class="i-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="4.2"/><path d="M12 2.5v2M12 19.5v2M2.5 12h2M19.5 12h2M5.3 5.3l1.4 1.4M17.3 17.3l1.4 1.4M5.3 18.7l1.4-1.4M17.3 6.7l1.4-1.4"/></svg>
      <svg class="i-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round" aria-hidden="true"><path d="M20 14.5A8 8 0 0 1 9.5 4a8 8 0 1 0 10.5 10.5Z"/></svg>
    </button>
    <button type="button" id="full" class="btn btn--primary">Tela cheia</button>
  </div>
</div>
<button type="button" class="bar-handle" id="handle" aria-controls="bar" aria-expanded="false" aria-label="Mostrar a barra do jogo">
  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m6 9 6 6 6-6"/></svg>
</button>
<script src="games.js"></script>
<script>
(()=>{
const $=id=>document.getElementById(id);
const qs=new URLSearchParams(location.search), slug=qs.get('g');
const data=window.FLIPERAMA, g=data&&data.games.find(x=>x.slug===slug);
if(!g){
  const m=document.createElement('p'); m.className='msg';
  m.innerHTML='Esse jogo não está no catálogo. <a href="./">Voltar pro Fliperama</a>.';
  document.body.append(m); $('title').textContent='Jogo não encontrado';
  document.querySelector('.tools').hidden=true; return;
}
$('by').textContent='@'+g.author+(g.controls?' · '+g.controls:'');
// versões: ?v=<id> escolhe qual abrir; sem ?v= abre a primeira (a padrão do game.json)
const vs=g.versions&&g.versions.length>1?g.versions:null;
let cur=vs?(vs.find(v=>v.id===qs.get('v'))||vs[0]):null;
const f=document.createElement('iframe');
f.allow='autoplay; fullscreen; gamepad; clipboard-write; screen-wake-lock';
f.addEventListener('load',()=>{ try{ f.focus(); f.contentWindow.focus(); }catch(e){} });
function showVersion(){
  const entry=cur?cur.entry:g.entry, name=g.title+(cur&&cur!==vs[0]?' · '+cur.name:'');
  document.title=name+' · Fliperama'; $('title').textContent=name; f.title=name;
  if(data.repo){ const dir=entry.includes('/')?'/'+entry.slice(0,entry.lastIndexOf('/')):''; $('code').href=data.repo+'/tree/main/games/'+g.slug+dir; $('code').hidden=false; }
  f.src='games/'+g.slug+'/'+entry+location.hash;
}
if(vs){
  const sel=$('ver');
  for(const v of vs){ const o=document.createElement('option'); o.value=v.id; o.textContent=v.name+(v.kind?' ('+v.kind+')':''); if(v.note) o.title=v.note; sel.append(o); }
  sel.value=cur.id; $('verBox').hidden=false;
  sel.addEventListener('change',()=>{
    cur=vs.find(v=>v.id===sel.value)||vs[0];
    const u=new URL(location.href); u.searchParams.set('v',cur.id); u.hash=''; history.replaceState(null,'',u);
    try{ const k='fliperama:versoes', m=JSON.parse(localStorage.getItem(k)||'{}')||{}; m[g.slug]=cur.id; localStorage.setItem(k,JSON.stringify(m)); }catch(e){}
    showVersion();
  });
}
showVersion();
document.body.append(f);
$('reload').addEventListener('click',()=>{ f.src=f.src; });
$('full').addEventListener('click',()=>{ const p=f.requestFullscreen?f.requestFullscreen():null; if(p&&p.catch) p.catch(()=>{}); try{ f.focus(); }catch(e){} });

// barra escondida durante o jogo: a seta abre por cima do jogo; voltar pro jogo (clique nele ou Esc) fecha
const bar=$('bar'), handle=$('handle');
function setBar(open, refocus){
  document.body.classList.toggle('bar-open', open);
  handle.setAttribute('aria-expanded', String(open));
  handle.setAttribute('aria-label', open ? 'Esconder a barra do jogo' : 'Mostrar a barra do jogo');
  bar.inert = !open;
  if(!open && refocus){ try{ f.focus(); f.contentWindow.focus(); }catch(e){} }
}
document.body.classList.add('has-game');
setBar(false);
handle.addEventListener('click',()=>setBar(!document.body.classList.contains('bar-open'), true));
// clicar no jogo tira o foco desta página e passa pro iframe
addEventListener('blur',()=>setTimeout(()=>{ if(document.activeElement===f && document.body.classList.contains('bar-open')) setBar(false); },0));
addEventListener('keydown',e=>{ if(e.key==='Escape' && document.body.classList.contains('bar-open')) setBar(false, true); });
})();
</script>
</body>
</html>
